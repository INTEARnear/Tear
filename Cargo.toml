cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = ["tearbot", "wallet-tracking", "explorer", "tip-bot", "raid-bot", "house-of-stake", "subscription-lists"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.96"
async-trait = "0.1.79"
base64 = "0.22.0"
cached = "0.53.1"
chrono = "0.4.37"
dashmap = "6.0.1"
lazy_static = "1.4.0"
log = "0.4.21"
mongodb = "3.0.1"
bson = "2.11.0"
rand = "0.8.5"
reqwest = "0.11"
serde = "1.0.197"
serde_json = "1.0.115"
teloxide = { git = "https://github.com/teloxide/teloxide", rev = "3c46b96e0dc0cabc75d6430c4566d7e2e12fd233" }
tokio = "1.37.0"
tokio-stream = "0.1.15"
near-primitives = "0.37.4"
inindexer = "8.0.0"
redis = "0.25.4"
intear-events = { git = "https://github.com/INTEARnear/intear-events" }
futures-util = "0.3.30"
semver = "1.0.23"
dotenvy = "0.15.7"
itertools = "0.14.0"
simple_logger = "5.0.0"
urlencoding = "2.1.3"
bigdecimal = "0.4.5"
near-api = "0.8"
near-openapi-types = "0.8"
serde_with = "3.12.0"
imageproc = "0.25.0"
ab_glyph = "0.2.29"
qrcode = "0.14.1"
near-token = "0.3.3"
near-gas = "0.3.3"
near-jsonrpc-primitives = "0.37.4"
near-crypto = "0.37.4"
regex = "1.11.1"
axum = "0.8.6"

[workspace.metadata.patch]
crates = ["teloxide", "teloxide-core"]

[patch."https://github.com/teloxide/teloxide"]
teloxide = { path = "./target/patch/teloxide" }
teloxide-core = { path = "./target/patch/teloxide-core" }
