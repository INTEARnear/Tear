[package]
name = "tearbot-common"
version = { workspace = true }
edition = { workspace = true }
license = "MIT"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
cached = { workspace = true, features = [
    "async",
    "async_tokio_rt_multi_thread",
    "disk_store",
] }
chrono = { workspace = true }
dashmap = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
mongodb = { workspace = true }
bson = { workspace = true, features = ["chrono-0_4"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
teloxide = { workspace = true, features = [
    "throttle",
    "cache-me",
    "webhooks-axum",
] }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-stream = { workspace = true }
near-primitives = { workspace = true }
inindexer = { workspace = true }
redis = { workspace = true, features = [
    "tokio-rustls-comp",
    "connection-manager",
], optional = true }
inevents-redis-old = { git = "https://github.com/INTEARnear/inevents", rev = "81226476284317b4945f3470265b05a58b033633", package = "inevents-redis", optional = true }
inevents-redis = { git = "https://github.com/INTEARnear/inevents", optional = true }
nft-indexer = { git = "https://github.com/INTEARnear/nft-indexer", optional = true }
ft-indexer = { git = "https://github.com/INTEARnear/ft-indexer", optional = true }
potlock-indexer = { git = "https://github.com/INTEARnear/potlock-indexer", optional = true }
trade-indexer = { git = "https://github.com/INTEARnear/trade-indexer", optional = true }
new-token-indexer = { git = "https://github.com/INTEARnear/new-token-indexer", optional = true }
socialdb-indexer = { git = "https://github.com/INTEARnear/socialdb-indexer", optional = true }
log-indexer = { git = "https://github.com/INTEARnear/log-indexer", optional = true }
tx-indexer = { git = "https://github.com/INTEARnear/tx-indexer", optional = true }
near-min-api = { git = "https://github.com/INTEARnear/wallet", optional = true }
intear-events = { workspace = true }
futures-util = { workspace = true }
semver = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.23.1", features = [
    "rustls-tls-native-roots",
], optional = true }
serde_with = { workspace = true }
bigdecimal = { workspace = true }
near-api = { workspace = true }
near-token = { workspace = true }
near-gas = { workspace = true }
solana-sdk = { version = "2", optional = true }
near-jsonrpc-primitives = { workspace = true }
near-crypto = { workspace = true }

[features]
redis-events = ["redis", "inevents-redis", "inevents-redis-old"]
websocket-events = ["tokio-tungstenite"]
inindexer-events = [
    "inindexer/teardata",
    "inindexer/redb",
    "nft-indexer",
    "ft-indexer",
    "potlock-indexer",
    "trade-indexer",
    "new-token-indexer",
    "socialdb-indexer",
    "log-indexer",
    "tx-indexer",
    "near-min-api",
]
contract-logs-module = ["semver"]
ft-buybot-module = []
new-liquidity-pools-module = []
nft-buybot-module = []
potlock-module = []
price-alerts-module = []
socialdb-module = []
new-tokens-module = []
utilities-module = []
ai-moderator-module = []
burrow-liquidations-module = []
house-of-stake-module = []
price-commands-module = []
trading-bot-module = ["solana-sdk"]
wallet-tracking-module = []
explorer-module = []
tip-bot-module = []
raid-bot-module = []
subscription-lists-module = []
